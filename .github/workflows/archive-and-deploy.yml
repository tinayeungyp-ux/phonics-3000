name: Auto Archive Previous Version and Deploy

on:
  push:
    paths:
      - 'index.html'
    branches:
      - main

permissions:
  contents: write

jobs:
  archive-previous:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Previous index.html
        run: |
          mkdir -p archive
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          ARCHIVE_FILE="archive/index_${TIMESTAMP}.html"
          
          # 提取上一版本的 index.html
          git show HEAD~1:index.html > "$ARCHIVE_FILE" || echo "No previous version found"
          
          # 檢查歸檔檔案是否存在且有內容
          if [ -s "$ARCHIVE_FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$ARCHIVE_FILE"
            git commit -m "Auto-archive: 封存前版至 $ARCHIVE_FILE [skip ci]"
            
            # 先 pull --rebase 整合遠端最新變更，再安全 push
            git pull --rebase origin main
            git push origin main
          fi
