name: Auto Archive Previous Version and Deploy

on:
  push:
    paths:
      - 'index.html'
    branches:
      - main

permissions:
  contents: write

jobs:
  archive-previous:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Previous index.html with Version Increment
        run: |
          mkdir -p archive
          CURRENT_COUNT=$(find archive -maxdepth 1 -name "index_*.html" | wc -l)
          NEXT_VERSION=$((CURRENT_COUNT + 1))
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          ARCHIVE_FILE="archive/index_${TIMESTAMP}_v${NEXT_VERSION}.html"
          
          echo "Processing archive file: $ARCHIVE_FILE"
          git show HEAD~1:index.html > "$ARCHIVE_FILE" || echo "No previous version found"
          
          if [ -s "$ARCHIVE_FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$ARCHIVE_FILE"
            git commit -m "Auto-archive: save previous version to $ARCHIVE_FILE [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully created $ARCHIVE_FILE"
          fi
