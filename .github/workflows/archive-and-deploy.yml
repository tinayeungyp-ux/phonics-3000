name: Auto Archive Previous Version and Deploy

on:
push:
paths:
- 'index.html'
branches:
- main

permissions:
contents: write

jobs:
archive-previous:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
with:
fetch-depth: 2
token: ${{ secrets.GITHUB_TOKEN }}

  - name: Archive Previous index.html with Version Increment
    run: |
      mkdir -p archive
      
      # 1. 統計目前 archive 資料夾內現存的 .html 檔案數量，計算出最新版號 (v1, v2, ...)
      CURRENT_COUNT=$(find archive -maxdepth 1 -name "index_*.html" | wc -l)
      NEXT_VERSION=$((CURRENT_COUNT + 1))
      
      # 2. 生成時間戳記 (例如: 20260918_152921)
      TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
      
      # 3. 組合出格式：index_{timestamp}_v{version}.html
      ARCHIVE_FILE="archive/index_${TIMESTAMP}_v${NEXT_VERSION}.html"
      
      echo "📦 正在建立歸檔檔案: $ARCHIVE_FILE (版本: v${NEXT_VERSION})"
      
      # 4. 提取前一次 commit 的 index.html 內容寫入歸檔檔
      git show HEAD~1:index.html > "$ARCHIVE_FILE" || echo "No previous version found"
      
      # 5. 若檔案成功生成且非空，提交並推送到 GitHub
      if [ -s "$ARCHIVE_FILE" ]; then
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$ARCHIVE_FILE"
        git commit -m "Auto-archive: 封存前版至 $ARCHIVE_FILE [skip ci]"
        
        # 先 rebase 遠端變更，再安全 push
        git pull --rebase origin main
        git push origin main
        echo "✅ 成功封存 $ARCHIVE_FILE"
      fi
